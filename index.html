<!DOCTYPE html>

    <link rel="stylesheet" href="rootStyles.css">
    <link rel="stylesheet" href="./style.css">
    <script src="./scripts.js" defer></script>
</head>
<body>
    <table>
    <caption>
        Book Library
    </caption>
        <thead>
            <tr>
                <th></th>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>date</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <button id="new-book">New book</button>

    <dialog id="dialog-book">
        <form method="dialog" style="display: flex; flex-direction: column;">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>

            <label for="author">Author</label>
            <input type="text" id="author" name="author" required>

            <label for="year">Year</label>
            <input type="text" id="year" name="year" required>

            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <input type="submit" id="novalidate-close" value="Close" formnovalidate />
                <input id="submitBtn" type="submit">
            </div>
        </form>
    </dialog>
</body>
</html>
