<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="rootStyles.css">
    <link rel="stylesheet" href="./style.css">
    <script src="./scripts.js" defer></script>
</head>
<body>

    <table>
    <caption>
        Book Library
    </caption>
        <thead>
            <!-- Default Header Row -->
            <tr>
                <th></th>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Year</th>
                <th>Is Read?</th>
            </tr>
        </thead>
        <!-- Book Entries -->
        <tbody>
        </tbody>
    </table>

    <!-- Below the Table -->
    <button id="new-book">New book</button>
    <dialog id="dialog-book">
        <form method="dialog" style="display: flex; flex-direction: column;">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>

            <label for="author">Author</label>
            <input type="text" id="author" name="author" required>

            <label for="year">Year</label>
            <input type="text" id="year" name="year" required>

            <label for="read">Read?</label>
            <input type="text" id="read" name="read" required>

            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <button type="reset" id="close-button" value="Close" formnovalidate>Close</button>
                <button id="submit-btn" type="submit" formnovalidate>Submit</button>
            </div>
        </form>
    </dialog>
</body>
</html>
